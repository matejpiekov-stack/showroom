<!DOCTYPE html>
<html>
    <head>
        <title>showroom</title>
        <style>
            h1 {
                text-align: left;
                font-size: 64px;
            }
            header {
                border-bottom: 1px solid #000000;
                display: grid;
                align-items: center;
                grid-template-columns: 1fr auto 1fr;
                padding: 10px 40px;
            }
            .nav-links {
                display: flex;
                gap: 30px;
                grid-column: 2;
            }
            .nav-links a {
                text-decoration: none;
                color: #030303;
                font-size: 20px;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            }
            .nav-links a:hover {
                color: #cf7c37;
            }
            .Name{
                margin-left: 50px;
                color: #030303fb;
                font-size: 54px;
                grid-column: 1;
            }
            footer{
                border-top: 1px solid #000000;
                padding: 40px 60px 20px;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            }
            .footer-content {
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 30px;
            }
            .footer-col {
                flex: 1;
                min-width: 180px;
            }
            .footer-col h3 {
                font-size: 22px;
                margin-bottom: 10px;
            }
            .footer-col h4 {
                font-size: 16px;
                margin-bottom: 10px;
                color: #444;
            }
            .footer-links {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .footer-links a {
                text-decoration: none;
                color: #030303;
                font-size: 15px;
            }
            .footer-links a:hover {
                color: #cf7c37;
            }
            .copyright {
                text-align: center;
                margin-top: 30px;
                font-size: 13px;
                color: #666;
            }
            #price-form {
                display: flex;
                flex-direction: column;
                gap: 15px;
                max-width: 400px;
                margin: 40px auto;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
                font-size: 18px;
            }
            #price-form input, #price-form select {
                padding: 8px;
                font-size: 16px;
            }
            #price-form button {
                padding: 10px;
                font-size: 18px;
                cursor: pointer;
            }
            #result {
                text-align: center;
                font-size: 22px;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
                margin-bottom: 30px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1 class="Name">Showroom</h1>
            <nav class="nav-links">
                <a href="index.html">Main Page</a>
                <a href="tutorial.html">Tutorial</a>
                <a href="tools.html">Tools</a>
            </nav>
        </header>

        <form id="price-form">
            <label>Make: <input type="text" id="make" required></label>
            <label>Model: <input type="text" id="model" required></label>
            <label>Year: <input type="number" id="year" required></label>
            <label>Mileage (km): <input type="number" id="mileage" required></label>
            <label>Condition:
                <select id="condition" required>
                    <option value="Excellent">Excellent</option>
                    <option value="Good">Good</option>
                    <option value="Fair">Fair</option>
                    <option value="Poor">Poor</option>
                </select>
            </label>
            <button type="submit">Get Estimate</button>
        </form>

        <div id="result"></div>

        <footer>
            <div class="footer-content">
                <div class="footer-col">
                    <h3>Showroom</h3>
                    <p>Helping car sellers get noticed, priced right, and sold faster.</p>
                </div>
                <div class="footer-col">
                    <h4>Quick Links</h4>
                    <nav class="footer-links">
                        <a href="index.html">Main Page</a>
                        <a href="tutorial.html">Tutorial</a>
                        <a href="tools.html">Tools</a>
                    </nav>
                </div>
                <div class="footer-col">
                    <h4>Legal</h4>
                    <nav class="footer-links">
                        <a href="privacy.html">Privacy Policy</a>
                        <a href="terms.html">Terms of Service</a>
                    </nav>
                </div>
                <div class="footer-col">
                    <h4>Contact</h4>
                    <p>support@showroom.com</p>
                </div>
            </div>
            <p class="copyright">© 2026 Showroom. All rights reserved.</p>
        </footer>

        <script>
            document.getElementById('price-form').addEventListener('submit', async function(e) {
                e.preventDefault();

                const make = document.getElementById('make').value;
                const model = document.getElementById('model').value;
                const year = document.getElementById('year').value;
                const mileage = document.getElementById('mileage').value;
                const condition = document.getElementById('condition').value;

                document.getElementById('result').innerText = "Calculating...";

                try {
                    const response = await fetch('http://localhost:3000/estimate-price', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ make, model, year, mileage, condition })
                    });

                    const data = await response.json();
                    document.getElementById('result').innerText = `Estimated price: ${data.estimate}`;
                } catch (err) {
                    document.getElementById('result').innerText = "Error getting estimate. Is the server running?";
                    console.error(err);
                }
            });
        </script>
    </body>
</html>
