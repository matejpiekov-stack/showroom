<!DOCTYPE html>
<html>
    <head>
        <title>showroom</title>
        <style>
            h1 {
                text-align: left;
                font-size: 64px;
            }
            header {
                border-bottom: 1px solid #000000;
                display: grid;
                align-items: center;
                grid-template-columns: 1fr auto 1fr;
                padding: 10px 40px;
            }
            .nav-links {
                display: flex;
                gap: 30px;
                grid-column: 2;
            }
            .nav-links a {
                text-decoration: none;
                color: #030303;
                font-size: 20px;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            }
            .nav-links a:hover {
                color: #cf7c37;
            }
            .Name{
                margin-left: 50px;
                color: #030303fb;
                font-size: 54px;
                grid-column: 1;
            }
            footer{
                border-top: 1px solid #000000;
                padding: 40px 60px 20px;
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            }
            .footer-content {
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 30px;
            }
            .footer-col {
                flex: 1;
                min-width: 180px;
            }
            .footer-col h3 {
                font-size: 22px;
                margin-bottom: 10px;
            }
            .footer-col h4 {
                font-size: 16px;
                margin-bottom: 10px;
                color: #444;
            }
            .footer-links {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .footer-links a {
                text-decoration: none;
                color: #030303;
                font-size: 15px;
            }
            .footer-links a:hover {
                color: #cf7c37;
            }
            .copyright {
                text-align: center;
                margin-top: 30px;
                font-size: 13px;
                color: #666;
            }
        </style>
    </head>
    <body>
        <header>
            <h1 class="Name">Showroom</h1>
            <nav class="nav-links">
                <a href="index.html">Main Page</a>
                <a href="tutorial.html">Tutorial</a>
                <a href="tools.html">Tools</a>
            </nav>
        </header>
        <form id="price-form">
            <label>Original/new price (€): <input type="number" id="originalPrice" required></label>
            <label>Year: <input type="number" id="year" required></label>
            <label>Mileage (km): <input type="number" id="mileage" required></label>
            <label>Condition:
                <select id="condition" required>
                    <option value="1.1">Excellent</option>
                    <option value="1.0">Good</option>
                    <option value="0.85">Fair</option>
                    <option value="0.65">Poor</option>
                </select>
            </label>
            <button type="submit">Get Estimate</button>
        </form>

<div id="result"></div>
        <footer>
            <div class="footer-content">
                <div class="footer-col">
                    <h3>Showroom</h3>
                    <p>Helping car sellers get noticed, priced right, and sold faster.</p>
                </div>
                <div class="footer-col">
                    <h4>Quick Links</h4>
                    <nav class="footer-links">
                        <a href="index.html">Main Page</a>
                        <a href="tutorial.html">Tutorial</a>
                        <a href="tools.html">Tools</a>
                    </nav>
                </div>
                <div class="footer-col">
                    <h4>Legal</h4>
                    <nav class="footer-links">
                        <a href="privacy.html">Privacy Policy</a>
                        <a href="terms.html">Terms of Service</a>
                    </nav>
                </div>
                <div class="footer-col">
                    <h4>Contact</h4>
                    <p>support@showroom.com</p>
                </div>
            </div>
            <p class="copyright">© 2026 Showroom. All rights reserved.</p>
        </footer>
        <script>
            document.getElementById('price-form').addEventListener('submit', function(e) {
                e.preventDefault();

                const originalPrice = parseFloat(document.getElementById('originalPrice').value);
                const year = parseInt(document.getElementById('year').value);
                const mileage = parseInt(document.getElementById('mileage').value);
                const conditionMultiplier = parseFloat(document.getElementById('condition').value);

                const currentYear = new Date().getFullYear();
                const age = Math.max(currentYear - year, 0);

                // Realistic depreciation curve:
                // Cars lose ~20-25% in year 1, then level off toward a floor
                // (based on typical real-world depreciation patterns)
                const floorFraction = 0.10; // cars rarely go below 10% of original value while still running
                const decayRate = 0.83;     // roughly matches ~50% value loss by year 5

                let ageFraction = floorFraction + (1 - floorFraction) * Math.pow(decayRate, age);
                let priceAfterAge = originalPrice * ageFraction;

                // Mileage adjustment relative to "expected" mileage for the car's age
                const expectedMileage = age * 15000; // 15,000km/year is a common EU average
                const mileageDiff = mileage - expectedMileage;

                // Each 20,000km above/below expected shifts value by ~4%
                let mileageFactor = 1 - (mileageDiff / 20000) * 0.04;
                mileageFactor = Math.max(0.5, Math.min(mileageFactor, 1.2)); // clamp extremes

                let finalPrice = priceAfterAge * mileageFactor * conditionMultiplier;
                finalPrice = Math.max(finalPrice, originalPrice * 0.05); // absolute floor: 5% of original

                document.getElementById('result').innerText =
                    `Estimated price: €${finalPrice.toFixed(0)}`;
            });
        </script>
    </body>
</html>
